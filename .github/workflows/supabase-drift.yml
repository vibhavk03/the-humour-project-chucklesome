name: Supabase drift

on:
  pull_request:
    paths: ['supabase/**', 'scripts/*supabase*', 'scripts/schema-sync-catalog.mjs', '.github/workflows/supabase-drift.yml']
  push:
    paths: ['supabase/**', 'scripts/*supabase*', 'scripts/schema-sync-catalog.mjs', '.github/workflows/supabase-drift.yml']
  workflow_dispatch:
  schedule:
    - cron: '37 13 * * *'

permissions:
  contents: read

concurrency:
  group: supabase-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/supabase-parity.test.mjs
      - run: node scripts/check-supabase-drift.mjs --offline

  live-drift:
    needs: baseline-tests
    # Secrets are never supplied to pull requests or non-default branches.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check CI credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo '::error::Configure the SUPABASE_ACCESS_TOKEN Actions secret for a Supabase account with read access to both projects.'
            exit 1
          fi
      - name: Compare live projects with the reviewed baseline
        run: node scripts/check-supabase-drift.mjs
